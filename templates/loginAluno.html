{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Aluno</title>
    <link rel="stylesheet" href="{% static 'loginAluno.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

<div class="container">
    <div class="lado-esquerdo">
        <img src="{% static 'imagens/logoaluno.png' %}" class="logo" alt="Logo">
        <img src="{% static 'imagens/aluno.png' %}" class="astronauta" alt="Astronauta">
    </div>
    <div class="lado-direito">
        <div class="card-login">
            <h1>Alunos</h1>
            <div class="icone">
                <i class="fa-solid fa-user"></i>
            </div>
            <form method="POST">
                {% csrf_token %}

                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="seu@email.com" value="{{ email }}" required>
                <input type="password" name="senha" placeholder="Senha" required>

                <button type="submit">Entrar</button>
            </form>
            {% if erro %}
                <div class="erro-mensagem" style="margin-top: 15px; padding: 10px 15px; background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; border-radius: 6px; font-size: 0.9rem; text-align: center;">
                    <i class="fa-solid fa-circle-exclamation me-1"></i>
                    {{ erro }}
                </div>
            {% endif %} 

        </div>
    </div>
</div>
</body>
</html>
